[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filesconverter"
version = "0.0.2"
description = "Windows desktop converter and merger for TXT and FB2 books"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7,<6.10",
]

[project.optional-dependencies]
dev = [
  "Pillow>=10,<12",
  "pyinstaller>=6,<7",
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
filesconverter = "filesconverter.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
filesconverter = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
